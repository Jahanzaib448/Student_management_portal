{% extends "base.html" %}

{% block title %}Add Course{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">📚 Add New Course</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('add_course') }}">
                        <!-- Course Name -->
                        <div class="mb-3">
                            <label for="course_name" class="form-label">Course Name</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="course_name" 
                                   name="course_name" 
                                   placeholder="e.g., Introduction to Python"
                                   required>
                        </div>

                        <!-- Course Code -->
                        <div class="mb-3">
                            <label for="course_code" class="form-label">Course Code</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="course_code" 
                                   name="course_code" 
                                   placeholder="e.g., CS101"
                                   required>
                            <small class="text-muted">Unique code for this course.</small>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" 
                                      id="description" 
                                      name="description" 
                                      rows="3"
                                      placeholder="Course description..."></textarea>
                        </div>

                        <!-- Credit Hours -->
                        <div class="mb-3">
                            <label for="credit_hours" class="form-label">Credit Hours</label>
                            <input type="number" 
                                   class="form-control" 
                                   id="credit_hours" 
                                   name="credit_hours" 
                                   placeholder="e.g., 3"
                                   min="1"
                                   required>
                        </div>

                        <!-- Duration -->
                        <div class="mb-3">
                            <label for="duration" class="form-label">Duration</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="duration" 
                                   name="duration" 
                                   placeholder="e.g., 16 weeks, 1 semester"
                                   required>
                        </div>

                        <!-- Start Date -->
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" 
                                   class="form-control" 
                                   id="start_date" 
                                   name="start_date"
                                   required>
                        </div>

                        <!-- End Date -->
                        <div class="mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" 
                                   class="form-control" 
                                   id="end_date" 
                                   name="end_date"
                                   required>
                        </div>

                        <!-- Teacher Assignment -->
                        <div class="mb-3">
                            <label for="teacher_id" class="form-label">Assign Teacher</label>
                            <select class="form-select" id="teacher_id" name="teacher_id">
                                <option value="">-- Select Teacher --</option>
                                {% for teacher in teachers %}
                                <option value="{{ teacher.id }}">
                                    {{ teacher.teacher_name }} - {{ teacher.specialization }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                ➕ Add Course
                            </button>
                            <a href="{{ url_for('courses') }}" class="btn btn-secondary">
                                ← Back to Courses
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
