{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h3 class="mb-0">✏️ Edit Course: {{ course.course_name }}</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_course', id=course.id) }}">
                        <!-- Course Name -->
                        <div class="mb-3">
                            <label for="course_name" class="form-label">Course Name</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="course_name" 
                                   name="course_name" 
                                   value="{{ course.course_name }}"
                                   required>
                        </div>

                        <!-- Course Code -->
                        <div class="mb-3">
                            <label for="course_code" class="form-label">Course Code</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="course_code" 
                                   name="course_code" 
                                   value="{{ course.course_code }}"
                                   required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" 
                                      id="description" 
                                      name="description" 
                                      rows="3">{{ course.description }}</textarea>
                        </div>

                        <!-- Credit Hours -->
                        <div class="mb-3">
                            <label for="credit_hours" class="form-label">Credit Hours</label>
                            <input type="number" 
                                   class="form-control" 
                                   id="credit_hours" 
                                   name="credit_hours" 
                                   value="{{ course.credit_hours }}"
                                   min="1"
                                   required>
                        </div>

                        <!-- Duration -->
                        <div class="mb-3">
                            <label for="duration" class="form-label">Duration</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="duration" 
                                   name="duration" 
                                   value="{{ course.duration }}"
                                   required>
                        </div>

                        <!-- Start Date -->
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" 
                                   class="form-control" 
                                   id="start_date" 
                                   name="start_date" 
                                   value="{{ course.start_date.strftime('%Y-%m-%d') }}"
                                   required>
                        </div>

                        <!-- End Date -->
                        <div class="mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" 
                                   class="form-control" 
                                   id="end_date" 
                                   name="end_date" 
                                   value="{{ course.end_date.strftime('%Y-%m-%d') }}"
                                   required>
                        </div>

                        <!-- Teacher Assignment -->
                        <div class="mb-3">
                            <label for="teacher_id" class="form-label">Assign Teacher</label>
                            <select class="form-select" id="teacher_id" name="teacher_id">
                                <option value="">-- Select Teacher --</option>
                                {% for teacher in teachers %}
                                <option value="{{ teacher.id }}" 
                                        {% if course.teacher_id == teacher.id %}selected{% endif %}>
                                    {{ teacher.teacher_name }} - {{ teacher.specialization }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning btn-lg">
                                💾 Update Course
                            </button>
                            <a href="{{ url_for('course_detail', id=course.id) }}" class="btn btn-info">
                                📋 View Course
                            </a>
                            <a href="{{ url_for('courses') }}" class="btn btn-secondary">
                                ← Back to Courses
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
